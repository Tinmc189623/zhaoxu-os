timeout: 3
remember_last_entry: yes
default_entry: 1
serial: yes
interface_branding: Zhaoxu OS
interface_branding_colour: 0x1f6feb
interface_help: Yuanshuo microkernel / Limine boot manager
term_palette: 1e1e2e;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;bac2de
term_palette_bright: 585b70;f38ba8;a6e3a1;f9e2af;89b4fa;f5c2e7;94e2d5;a6adc8
term_background: 11111b
term_foreground: cdd6f4

/Zhaoxu OS (Aqua)
    protocol: limine
    path: boot():/casper/kernel.elf
    module_path: boot():/casper/kernel.bin
    module_path: boot():/boot/limine/MiSans.ttf
    module_path: boot():/boot/limine/WALL.RGB
    resolution: 1920x1080x32

/Zhaoxu OS (Serial console)
    protocol: limine
    path: boot():/casper/kernel.elf
    module_path: boot():/casper/kernel.bin
    module_path: boot():/boot/limine/MiSans.ttf
    module_path: boot():/boot/limine/WALL.RGB
    resolution: 1024x768x32
